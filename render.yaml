{
  "services": [
    {
      "type": "web",
      "name": "seb-ai-support-desk",
      "env": "node",
      "plan": "free",
      "buildCommand": "npm install && npm run build",
      "startCommand": "npm start",
      "envVars": [
        {
          "key": "NODE_VERSION",
          "value": "20.12.0"
        },
        {
          "key": "GMAIL_APP_PASSWORD",
          "sync": false
        },
        {
          "key": "SEB_AI_API_KEY",
          "sync": false
        }
      ]
    }
  ]
}
